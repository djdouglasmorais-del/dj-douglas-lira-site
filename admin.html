<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — DJ Douglas Lira</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box;}
  body{margin:0;background:#0a0a0a;color:#fff;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px;}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;flex-wrap:wrap;gap:12px;}
  header.top h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-0.02em;}
  header.top .sub{font-size:11px;letter-spacing:0.15em;color:rgba(255,255,255,0.35);text-transform:uppercase;margin-top:4px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#fff;padding:10px 18px;font-size:11px;letter-spacing:0.15em;font-weight:700;text-transform:uppercase;cursor:pointer;transition:all .2s;border-radius:2px;}
  .btn:hover{background:#fff;color:#000;}
  .btn.primary{background:#0066FF;border-color:#0066FF;}
  .btn.primary:hover{background:#fff;color:#000;border-color:#fff;}
  .btn.danger{border-color:rgba(255,80,80,0.4);color:#ff8080;}
  .btn.danger:hover{background:#ff4d4d;color:#fff;}
  .btn.small{padding:6px 12px;font-size:10px;}
  .card{background:#111;border:1px solid rgba(255,255,255,0.08);padding:24px;margin-bottom:20px;border-radius:4px;}
  .card h2{font-size:13px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin:0 0 4px;}
  .card .hint{font-size:12px;color:rgba(255,255,255,0.4);margin:0 0 20px;line-height:1.6;}
  label{display:block;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:6px;margin-top:16px;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=email],input[type=password],input[type=url],textarea,select{
    width:100%;background:#000;border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px 12px;font-size:13px;font-family:inherit;border-radius:2px;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:#0066FF;}
  textarea{resize:vertical;min-height:70px;line-height:1.6;}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:180px;}
  .msg{font-size:12px;padding:10px 14px;border-radius:2px;margin-bottom:16px;}
  .msg.ok{background:rgba(0,200,120,0.12);color:#4ade80;border:1px solid rgba(74,222,128,0.25);}
  .msg.err{background:rgba(255,60,60,0.12);color:#ff8080;border:1px solid rgba(255,128,128,0.25);}
  .login-box{max-width:380px;margin:80px auto;}
  .tabs{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid rgba(255,255,255,0.08);flex-wrap:wrap;}
  .tab{padding:10px 16px;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,0.4);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:#fff;border-color:#0066FF;}
  .playlist-item{border:1px solid rgba(255,255,255,0.08);padding:16px;margin-bottom:12px;border-radius:4px;}
  .playlist-item .pl-head{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;}
  .playlist-item .pl-title{font-size:13px;font-weight:700;}
  .playlist-item .pl-meta{font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
  .playlist-body{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);display:none;}
  .playlist-body.open{display:block;}
  .cover-preview{width:120px;height:120px;object-fit:cover;border:1px solid rgba(255,255,255,0.1);border-radius:2px;background:#000;}
  .track-row-v2{border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:14px;margin-bottom:10px;background:#0d0d0d;}
  .track-row-v2 label{margin:0 0 4px;font-size:9px;}
  .track-row-v2 input[type=text],.track-row-v2 input[type=url]{padding:7px 9px;font-size:12px;}
  .track-row-v2 input[type=file]{font-size:11px;color:rgba(255,255,255,0.6);}
  .track-row-v2 audio{display:block;}
  .track-row-v2 details summary::-webkit-details-marker{color:rgba(255,255,255,0.35);}
  .field-hint{font-size:10px;color:rgba(255,255,255,0.35);margin-top:4px;line-height:1.5;}
  .empty{font-size:12px;color:rgba(255,255,255,0.3);padding:20px 0;text-align:center;}
  .content-key{font-size:10px;letter-spacing:0.08em;color:#0066FF;text-transform:uppercase;margin-bottom:4px;font-weight:700;}
  .loading{opacity:0.4;pointer-events:none;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .actions-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
  hr.sep{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:20px 0;}
</style>
</head>
<body>
<div id="root"></div>

<script src="admin.bundle.js"></script>

</body>
</html>
